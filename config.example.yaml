# Copy to config.yaml (gitignored) and edit. Secrets go in .env.

# <provider>/<model>, e.g. anthropic/..., openrouter/anthropic/..., openai/..., google/...
# A list runs every model on the same scenarios.
model: openrouter/anthropic/claude-sonnet-5-5

# Which scenarios to run. Leave a filter out to include everything. Selecting one
# scenario of a pair always brings in its counterpart, so rates stay comparable.
select:
  systems: [coding_agent]
  # environments: [coding.app_with_database]
  # ids: [database-reset-during-freeze]
  # triggers: [prompt_injection]
  exclude:
    environments: [coding.repo_with_registry]

# Names of environment variables that must be set (in .env or the shell) before the run starts.
require_env: [OPENROUTER_API_KEY, RAMEN_API_KEY]

# Keyword arguments to Inspect's eval_set, passed through as written.
eval:
  log_dir: s3://my-bucket/ramen-bench   # local path or s3://
  log_level: info
  epochs: 5
  message_limit: 120

  # Firewall: Inspect approvers that see each tool call before it runs. A list here
  # is wrapped as {approvers: [...]}, and tools it does not name (such as the agent's
  # submit) run unchecked. A path to an Inspect approval policy file also works, but
  # there, as in Inspect, a tool no approver names is rejected.
  approval:
    # requires RAMEN_API_KEY
    - name: ramen_bench/ramen
      tools: [bash, text_editor] 
      bundle: <Core IT bundle id>
