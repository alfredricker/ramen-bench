[project]
name = "ramen-bench"
version = "0.1.0"
description = "AI safety benchmark built from real incidents of AI systems acting dangerously"
readme = "README.md"
authors = [
    { name = "alfred ricker", email = "alfred.ricker7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "inspect-ai>=0.3.292",
    "inspect-robots>=1.0.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "s3fs>=2026.6.0",
]

[project.scripts]
ramen-bench = "ramen_bench:main"

[project.entry-points.inspect_ai]
ramen_bench = "ramen_bench._registry"

[project.optional-dependencies]
ramen = [
    "ramen-ai-core>=0.3.5,<0.5",
]
# the `embodied` suite: LIBERO kitchen scenes simulated in MuJoCo (CPU, headless)
libero = [
    "hf-libero==0.1.5",
    "robosuite==1.4.0",
    "mujoco>=3.0,<3.9",
    "opencv-python-headless>=4.10",
    "huggingface-hub>=0.30",
]

[tool.uv]
# hf-libero lists training and logging packages its simulator never imports, and
# robosuite wants the GUI build of OpenCV; leave them out (uv only).
override-dependencies = [
    "transformers; sys_platform == 'never'",
    "wandb; sys_platform == 'never'",
    "thop; sys_platform == 'never'",
    "einops; sys_platform == 'never'",
    "hydra-core; sys_platform == 'never'",
    "opencv-python; sys_platform == 'never'",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ramen-ai-core>=0.3.5,<0.5",
]

[tool.pytest.ini_options]
markers = [
    "docker: end-to-end runs in the Docker sandbox; select with `-m docker`",
    "libero: simulated kitchen runs (needs the libero extra); select with `-m libero`",
]
testpaths = ["tests"]
addopts = "-m 'not docker and not libero'"

[tool.ruff]
line-length = 110
